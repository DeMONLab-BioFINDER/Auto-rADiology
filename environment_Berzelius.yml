name: ai-pet
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.10
  - pytorch=2.4.*
  - torchvision=0.19.*
  - torchaudio=2.4.*
  - pytorch-cuda=12.1        # works with CUDA 12.2 drivers
  - pandas
  - scikit-learn
  - statsmodels
  - tqdm
  - optuna
  - matplotlib
  - nibabel
  - nilearn
  - plotly
  - pip
  - pip:
      - monai>=1.3
      - SimpleITK  # rigid PET-to-template alignment (scripts/convert_tau_pkl_to_pt.py --rigid_template)

